<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do list</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title mb-3">Task Manager</h2>
                <div class="mb-3">
                    <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task">
                    <button id="addBtn" class="btn btn-primary mt-2">Add Task</button>
                </div>
                <div id="alertBox" class="text-danger mt-2"></div>
                <ul id="taskList" class="list-group mt-3"></ul>
            </div>
        </div>
    </div>

    <script type="module">
         import { initApp } from './dist/main.js';
         document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
